name: CI

# Se activa CUANDO: 
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Garantiza que el backend app.py y base de datos sigan respondiendo a reglas de negocio antes de publicar
jobs:
  build:
    runs-on: ubuntu-latest #computadora virtual con LINUX
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Python  
        uses: actions/setup-python@v5 
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Correr pruebas
        run: pytest

